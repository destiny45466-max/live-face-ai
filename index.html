

<!doctype html>

<html lang="en">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Talking Avatar Studio</title>

<style>

*{box-sizing:border-box}

body{margin:0;padding:18px;font-family:Arial,sans-serif;background:#101827;color:white}

main{max-width:850px;margin:auto}

h1{text-align:center}

p{color:#c4cee0}

.panel{background:#1b2940;padding:16px;border-radius:16px;margin:16px 0}

.stage{position:relative;width:100%;max-width:360px;aspect-ratio:3/4;margin:auto;background:#080e19;border-radius:14px;overflow:hidden}

#face{display:none;width:100%;height:100%;object-fit:cover}

#placeholder{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px}

#mouth{display:none;position:absolute;top:69%;left:50%;transform:translate(-50%,-50%);width:17%;height:2%;border-radius:50%;background:#45101c;border:2px solid #f2a6b5}

#mouth.talking{animation:talk .2s infinite alternate}

@keyframes talk{from{height:1%}to{height:7%}}

label{display:block;margin:14px 0 6px;font-weight:bold}

input,textarea,select{width:100%;padding:11px;border-radius:9px;border:1px solid #53637d;background:#101827;color:white}

textarea{min-height:100px}

button{padding:12px;border:0;border-radius:9px;font-weight:bold;background:#8ca8ff;color:#101827}

.buttons{display:flex;gap:10px;margin-top:12px}

.buttons button{flex:1}

#status{color:#bcd0ff}

small{color:#c4cee0}

</style>

</head>

<body>

<main>

<h1>🎙️ Talking Avatar Studio</h1>

<p>Upload a photo, type a message, and let your avatar speak.</p>

<section class="panel">

<div class="stage">

<div id="placeholder">Your avatar will appear here.<br>Choose a photo below.</div>

<img id="face" alt="Your avatar">

<div id="mouth"></div>

</div>

<label for="photo">Choose your photo</label>

<input id="photo" type="file" accept="image/*">

<label for="mouthY">Mouth position up/down</label>

<input id="mouthY" type="range" min="45" max="88" value="69">

<label for="mouthX">Mouth position left/right</label>

<input id="mouthX" type="range" min="25" max="75" value="50">

<label for="mouthSize">Mouth width</label>

<input id="mouthSize" type="range" min="8" max="30" value="17">

</section>

<section class="panel">

<label for="words">What should your avatar say?</label>

<textarea id="words">Hello! Welcome to my talking avatar website. It's nice to meet you!</textarea>

<label for="voice">Choose a voice</label>

<select id="voice"><option value="">Default voice</option></select>

<div class="buttons">

<button id="speak">Speak ▶</button>

<button id="stop">Stop ■</button>

</div>

<p id="status">Ready. Choose a photo and tap Speak.</p>

<small>This demo uses your browser's speech feature. Mouth movement is approximate, not exact lip-sync.</small>

</section>

</main>

<script>

const photo=document.getElementById('photo');

const face=document.getElementById('face');

const placeholder=document.getElementById('placeholder');

const mouth=document.getElementById('mouth');

const words=document.getElementById('words');

const voiceSelect=document.getElementById('voice');

const status=document.getElementById('status');

photo.addEventListener('change',()=>{

 const file=photo.files[0];

 if(!file)return;

 face.src=URL.createObjectURL(file);

 face.style.display='block';

 mouth.style.display='block';

 placeholder.style.display='none';

 status.textContent='Photo loaded! Adjust the mouth position if needed.';

});

function positionMouth(){

 mouth.style.top=document.getElementById('mouthY').value+'%';

 mouth.style.left=document.getElementById('mouthX').value+'%';

 mouth.style.width=document.getElementById('mouthSize').value+'%';

}

['mouthY','mouthX','mouthSize'].forEach(id=>{

 document.getElementById(id).addEventListener('input',positionMouth);

});

positionMouth();

function loadVoices(){

 if(!('speechSynthesis' in window)){

  status.textContent='Speech is not supported in this browser. Try Safari or Chrome.';

  return;

 }

 const selected=voiceSelect.value;

 const voices=speechSynthesis.getVoices();

 voiceSelect.innerHTML='<option value="">Default voice</option>';

 voices.forEach((voice,index)=>{

  const option=document.createElement('option');

  option.value=index;

  option.textContent=voice.name+' ('+voice.lang+')';

  voiceSelect.appendChild(option);

 });

 if(selected)voiceSelect.value=selected;

}

if('speechSynthesis' in window){

 loadVoices();

 speechSynthesis.onvoiceschanged=loadVoices;

}

document.getElementById('speak').addEventListener('click',()=>{

 if(!('speechSynthesis' in window)){

  status.textContent='Speech is not available. Try Safari or Chrome.';

  return;

 }

 if(!words.value.trim()){

  status.textContent='Type something to say first.';

  return;

 }

 speechSynthesis.cancel();

 const speech=new SpeechSynthesisUtterance(words.value.trim());

 const voices=speechSynthesis.getVoices();

 if(voiceSelect.value!=='' && voices[Number(voiceSelect.value)]){

  speech.voice=voices[Number(voiceSelect.value)];

 }

 speech.rate=0.95;

 speech.onstart=()=>{

  if(face.style.display==='block')mouth.classList.add('talking');

  status.textContent='Avatar is speaking...';

 };

 speech.onend=()=>{

  mouth.classList.remove('talking');

  status.textContent='Finished speaking!';

 };

 speech.onerror=()=>{

  mouth.classList.remove('talking');

  status.textContent='Could not speak. Try again.';

 };

 speechSynthesis.speak(speech);

});

document.getElementById('stop').addEventListener('click',()=>{

 if('speechSynthesis' in window)speechSynthesis.cancel();

 mouth.classList.remove('talking');

 status.textContent='Speech stopped.';

});

</script>

</body>

</html>
